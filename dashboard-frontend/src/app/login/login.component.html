<div class="login-wrapper">
  <div class="login-card">

    <div class="login-header">
      <div class="login-logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 100 100" fill="white">
          <circle cx="50" cy="26" r="12"/>
          <ellipse cx="50" cy="63" rx="15" ry="21"/>
          <line x1="35" y1="50" x2="6" y2="36" stroke="white" stroke-width="5" stroke-linecap="round"/>
          <line x1="35" y1="59" x2="3" y2="58" stroke="white" stroke-width="5" stroke-linecap="round"/>
          <line x1="35" y1="68" x2="7" y2="79" stroke="white" stroke-width="5" stroke-linecap="round"/>
          <line x1="38" y1="76" x2="16" y2="91" stroke="white" stroke-width="5" stroke-linecap="round"/>
          <line x1="65" y1="50" x2="94" y2="36" stroke="white" stroke-width="5" stroke-linecap="round"/>
          <line x1="65" y1="59" x2="97" y2="58" stroke="white" stroke-width="5" stroke-linecap="round"/>
          <line x1="65" y1="68" x2="93" y2="79" stroke="white" stroke-width="5" stroke-linecap="round"/>
          <line x1="62" y1="76" x2="84" y2="91" stroke="white" stroke-width="5" stroke-linecap="round"/>
        </svg>
      </div>
      <h1>VIN</h1>
      <p>CFE — Ingresa tus credenciales</p>
    </div>

    <form (ngSubmit)="login()">
      <div class="mb-3">
        <label class="form-label fw-semibold">RPE</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="rpe"
          name="rpe"
          autocomplete="username"
          placeholder="RPE"
          required>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Contraseña</label>
        <input
          type="password"
          class="form-control"
          [(ngModel)]="password"
          name="password"
          autocomplete="current-password"
          placeholder="Contraseña"
          required>
      </div>

      <div *ngIf="error" class="alert alert-danger py-2 mb-3">
        {{ error }}
      </div>

      <button
        type="submit"
        class="btn btn-primary w-100 fw-semibold"
        [disabled]="loading">
        {{ loading ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

  </div>
</div>
